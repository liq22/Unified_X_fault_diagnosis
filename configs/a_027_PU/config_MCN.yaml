args:

  device: cuda
  data_dir: 'E:/dateset/generate/PU_bearing/' 
  dataset_task: a_027_PU
  target: 'PU_N09_M07_F10' 
  target_list: ['PU_N09_M07_F10', 'PU_N15_M01_F10', 'PU_N15_M07_F04', 'PU_N15_M07_F10']
  k_shot: 64

# model
  model: 'MCN_GFK' # 'Resnet' 'WKN_m' 'Sinc_net_m' 'Huan_net' 'TFN_Morlet' 'MCN_GFK'
  skip_connection: true
  num_classes: 3 # 5 for THU_018_basic 4 for THU_006_basic
  in_dim : 4096
  out_dim : 4096
  in_channels : 3
  out_channels : 3
  scale : 4

  f_c_mu: 0
  f_c_sigma: 0.1
  f_b_mu: 0
  f_b_sigma: 0.1


# hyperparameter
  learning_rate: 0.001
  batch_size: 64
  num_epochs: 200
  weight_decay: 0.0001
  num_workers: 6
  seed: 17

# train
  monitor: 'val_loss'
  patience: 100
  gpus: 1
  weight_decay: 0.0001
  l1_norm: 0.0001

  pruning: None # [0.7,0.5,0.01]
  snr: 0
