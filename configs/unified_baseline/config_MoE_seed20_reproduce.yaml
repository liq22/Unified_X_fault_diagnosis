# MoE - Seed 20复现实验
signal_processing_configs:
  layer1: ['HT','WF','I']
  layer2: ['HT','WF','I']
  layer3: ['I','WF','I']
  layer4: ['I','WF','I']

feature_extractor_configs: ['Mean', 'Std', 'Var', 'Entropy','Max', 'Min', 'AbsMean', 'Kurtosis', 'RMS', 'CrestFactor','Skewness', 'ClearanceFactor', 'ShapeFactor']

args:
  model: MoE
  skip_connection: true
  scale: 4
  l1_norm: 0.0001
  num_epochs: 100
  patience: 15
  gpus: 1

  # Seed 20配置 - 复现65.07%性能
  device: cuda
  data_dir: '/home/user/data/a_bearing/a_018_THU24_pro/'
  dataset_task: THU_018_basic
  target: 'IF'
  k_shot: 64
  num_classes: 5
  in_dim: 4096
  out_dim: 4096
  in_channels: 2
  out_channels: 3
  f_c_mu: 0
  f_c_sigma: 0.1
  f_b_mu: 0
  f_b_sigma: 0.1
  learning_rate: 0.001
  batch_size: 64
  weight_decay: 0.0001
  num_workers: 8
  seed: 20  # 关键：使用Seed 20
  monitor: 'val_loss'
  pruning: None
  snr: 0
  experiment_type: 'unified_baseline'
  description: 'MoE混合专家网络Seed 20复现实验 - 目标65.07%准确率'