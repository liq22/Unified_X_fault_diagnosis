# OperatorAttention - 算子注意力网络
signal_processing_configs:
  layer1: ['HT','WF','I']
  layer2: ['I','WF','I']
  layer3: ['HT','WF','I']
  layer4: ['I','WF','I']

feature_extractor_configs: ['Mean', 'Std', 'Var', 'Entropy','Max', 'Min', 'AbsMean', 'Kurtosis', 'RMS', 'CrestFactor','Skewness', 'ClearanceFactor', 'ShapeFactor']

args:
  model: OperatorAttention
  skip_connection: true
  scale: 4
  l1_norm: 0  # 2025-12-01调整：完全移除L1正则化以解决过度稀疏化问题
  num_epochs: 100
  patience: 15
  gpus: 1

  # 继承模板中的其他参数
  device: cuda
  data_dir: '/home/user/data/a_bearing/a_018_THU24_pro/'
  dataset_task: THU_018_basic
  target: 'IF'
  k_shot: 64
  num_classes: 5
  in_dim: 4096
  out_dim: 4096
  in_channels: 2
  out_channels: 3
  f_c_mu: 0
  f_c_sigma: 0.1
  f_b_mu: 0
  f_b_sigma: 0.1
  learning_rate: 0.0005  # 降低学习率以提升稳定性
  batch_size: 64
  weight_decay: 1e-5  # 降低权重衰减
  num_workers: 8
  seed: 17
  monitor: 'val_loss'
  pruning: None
  snr: 0
  experiment_type: 'unified_baseline'
  description: 'OperatorAttention算子注意力网络统一基线实验'