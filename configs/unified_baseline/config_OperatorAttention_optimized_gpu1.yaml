# OperatorAttention - 优化版算子注意力网络
# 专门用于验证算子注意力机制的改进配置
# 2025-12-02: 优化L1正则化和学习率，解决过拟合问题

signal_processing_configs:
  layer1: ['HT','WF','I']
  layer2: ['I','WF','I']
  layer3: ['HT','WF','I']
  layer4: ['I','WF','I']

feature_extractor_configs: ['Mean', 'Std', 'Var', 'Entropy','Max', 'Min', 'AbsMean', 'Kurtosis', 'RMS', 'CrestFactor','Skewness', 'ClearanceFactor', 'ShapeFactor']

args:
  model: OperatorAttention_enhanced
  skip_connection: true
  scale: 4
  l1_norm: 0  # 完全移除L1正则化，解决过度稀疏化问题

  # 训练优化参数
  num_epochs: 150  # 增加训练轮数
  patience: 20     # 增加早停耐心

  # 学习率优化
  learning_rate: 0.0005  # 降低学习率以提升稳定性
  scheduler: "CosineAnnealingLR"  # 使用余弦退火调度器
  T_max: 150  # 余弦退火周期
  eta_min: 1e-6  # 最小学习率

  # 正则化优化
  weight_decay: 1e-5  # 降低权重衰减
  dropout: 0.1  # 增加dropout防止过拟合

  # 实验配置
  gpus: 1
  device: cuda
  data_dir: '/home/user/data/PHMbenchdata/PHM-Vibench/data/THU_018'
  dataset_task: THU_018_basic
  target: 'IF'
  k_shot: 64
  num_classes: 5
  in_dim: 4096
  out_dim: 4096
  in_channels: 2
  out_channels: 3

  # 噪声和滤波参数
  f_c_mu: 0
  f_c_sigma: 0.1
  f_b_mu: 0
  f_b_sigma: 0.1

  batch_size: 64
  num_workers: 8
  seed: 200  # GPU 1实验种子
  monitor: 'val_loss'
  pruning: None
  snr: 0
  experiment_type: 'unified_baseline'
  description: 'OperatorAttention优化版实验GPU 1：16算子增强版本'
  experiment_name: 'OperatorAttention_enhanced_gpu1'